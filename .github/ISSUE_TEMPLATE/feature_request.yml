name: Feature request
description: Suggest a capability or a design change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景，而不是先给方案
      placeholder: 我在整理 5000 首曲库时，找不到……
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 已经试过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 曲库与扫描
        - 播放与音频
        - 歌词
        - 界面与响应式
        - 系统集成（托盘 / SMTC / 迷你播放器）
        - 其他
